<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Exploring Our World: a free social-studies course for young people. Works offline, with no accounts." />
    <meta name="theme-color" content="#ffff66" />
    <!--
      What WhatsApp, Telegram, Facebook, X and others show when someone
      pastes a link to the site: a title, a line and a picture. Crawlers
      need full addresses here, so when the site moves to its own domain,
      change https://thinkerwell.vercel.app below (and in og:url). The
      picture is made by scripts/make_social_card.mjs and
      scripts/optimise_images.py. None of this loads anything in a browser.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thinkerwell" />
    <meta property="og:title" content="Thinkerwell: Exploring Our World" />
    <meta property="og:description" content="A free social-studies course for young people. Works offline, with no accounts." />
    <meta property="og:url" content="https://thinkerwell.vercel.app/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://thinkerwell.vercel.app/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Thinkerwell mascot, a purple reader holding a book, above the words Thinkerwell: Exploring Our World." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thinkerwell: Exploring Our World" />
    <meta name="twitter:description" content="A free social-studies course for young people. Works offline, with no accounts." />
    <meta name="twitter:image" content="https://thinkerwell.vercel.app/social-card.png" />
    <meta name="twitter:image:alt" content="The Thinkerwell mascot, a purple reader holding a book, above the words Thinkerwell: Exploring Our World." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/images/thinkerwell-mascot-transparent.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Thinkerwell</title>
  </head>
  <body>
    <div id="root">
      <!--
        Shown until the app starts, then replaced by it (phase 8): on a slow
        connection the scripts take seconds, and until they run the page
        would be blank. This is the header's lemon bar with the mascot, drawn
        by the site's own stylesheet, so the page looks like Thinkerwell as
        soon as the CSS arrives (on Slow 3G, about 2 s instead of 6 s). The
        wordmark is left out so its font isn't fetched ahead of the scripts,
        and the mascot waits behind them (fetchpriority="low"). No words:
        every UI string lives in en.json.
      -->
      <div class="tw-boot" aria-hidden="true">
        <header class="tw-header">
          <div class="tw-header-inner">
            <span class="tw-logo"><img src="/images/thinkerwell-mascot-transparent.png" alt="" width="46" height="46" fetchpriority="low" /></span>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
