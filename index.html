<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffff66" />
    <!-- Each page's title, description and link-preview tags: filled in at build time (docs/notes/seo.md). -->
    <!--page-metadata-->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/images/thinkerwell-mascot-transparent.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <!--
        Shown until the app starts, then replaced by it (phase 8): on a slow
        connection the scripts take seconds, and until they run the page
        would be blank. This is the header's lemon bar with the mascot, drawn
        by the site's own stylesheet, so the page looks like Thinkerwell as
        soon as the CSS arrives (on Slow 3G, about 2 s instead of 6 s). The
        wordmark is left out so its font isn't fetched ahead of the scripts,
        and the mascot waits behind them (fetchpriority="low"). No words:
        every UI string lives in en.json.
      -->
      <div class="tw-boot" aria-hidden="true">
        <header class="tw-header">
          <div class="tw-header-inner">
            <span class="tw-logo"><img src="/images/thinkerwell-mascot-transparent.png" alt="" width="46" height="46" fetchpriority="low" /></span>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
