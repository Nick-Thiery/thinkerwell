<title>Lakeside Market</title>
<desc>Sebuah pasar tempat orang bertukar barang. Satu gerai menjual tomato untuk duit syiling, dua orang menukar roti dengan telur, seorang membaiki basikal sebagai balasan untuk bantuan membaca, dan seorang lelaki yang membawa ikan tidak dapat menukarnya dengan beras.</desc>
