<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
<title>Tiga sumber tentang Pasar Riverstone</title>
<desc>Tiga sumber tentang Pasar Riverstone di atas meja: lukisan pasar di tepi sungai, resit kedai dengan harga, dan sehelai muka surat diari.</desc>
<rect width="960" height="540" rx="24" fill="#FFE9C7"/>
<text x="40" y="66" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-size="28" font-weight="700" fill="#7A4300">Pasar Riverstone</text>
<!-- the table -->
<rect x="24" y="92" width="912" height="424" rx="20" fill="#A07850"/>
<path d="M24 150 C260 140, 520 162, 936 146 M24 300 C300 292, 640 312, 936 298 M24 470 C300 462, 600 482, 936 468" fill="none" stroke="#7A4300" stroke-width="3"/>

<!-- Source 1: a drawing of the market -->
<g transform="translate(200 280) rotate(-3)">
<rect x="-160" y="-122" width="320" height="244" rx="6" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<rect x="-146" y="-108" width="292" height="216" fill="#F3E3C3"/>
<!-- far bank and river in the background -->
<rect x="-146" y="-108" width="292" height="30" fill="#DCEFD5"/>
<rect x="-146" y="-78" width="292" height="24" fill="#6FB6D6"/>
<!-- buildings -->
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<rect x="-134" y="-60" width="40" height="36" fill="#FFFFFF"/><path d="M-140 -58 L-114 -80 L-88 -58Z" fill="#A07850"/>
<rect x="-80" y="-56" width="34" height="32" fill="#FFFFFF"/><path d="M-86 -54 L-63 -74 L-40 -54Z" fill="#A07850"/>
<rect x="86" y="-60" width="44" height="36" fill="#FFFFFF"/><path d="M80 -58 L108 -80 L136 -58Z" fill="#A07850"/>
<rect x="-116" y="-40" width="10" height="16" fill="#A07850"/><rect x="102" y="-40" width="10" height="16" fill="#A07850"/>
</g>
<!-- two stalls: food and cloth -->
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<path d="M-40 -34 V14 M20 -34 V14 M34 -34 V14 M94 -34 V14" stroke-width="3"/>
<path d="M-48 -40 H28 L22 -24 H-42Z" fill="#D2C0F9"/>
<path d="M-30 -40 L-28 -24 M-10 -40 L-9 -24 M10 -40 L9 -24" stroke-width="2"/>
<rect x="-44" y="-2" width="68" height="18" fill="#A07850"/>
<path d="M26 -40 H102 L96 -24 H32Z" fill="#FDE68A"/>
<path d="M44 -40 L45 -24 M64 -40 L64 -24 M84 -40 L83 -24" stroke-width="2"/>
<rect x="30" y="-2" width="68" height="18" fill="#A07850"/>
</g>
<g stroke="#0F0E0E" stroke-width="1.5">
<circle cx="-32" cy="-8" r="6" fill="#7A9B4E"/><circle cx="-20" cy="-8" r="6" fill="#FDE68A"/><circle cx="-8" cy="-8" r="6" fill="#7A9B4E"/><circle cx="4" cy="-8" r="6" fill="#FDE68A"/><circle cx="14" cy="-8" r="5" fill="#7A9B4E"/>
<rect x="38" y="-12" width="22" height="10" rx="2" fill="#D2C0F9"/><rect x="64" y="-12" width="26" height="10" rx="2" fill="#ECE4FD"/>
</g>
<!-- people carrying baskets -->
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<path d="M-118 88 V62 Q-118 44 -104 44 Q-90 44 -90 62 V88Z" fill="#1E4E94"/>
<circle cx="-104" cy="34" r="9" fill="#8D5524"/>
<path d="M-122 18 H-86 L-92 28 H-116Z" fill="#A07850"/>
<path d="M-54 92 V66 Q-54 48 -40 48 Q-26 48 -26 66 V92Z" fill="#3F6B35"/>
<circle cx="-40" cy="38" r="9" fill="#F1C27D"/>
<path d="M-26 70 H-8 L-11 86 H-23Z" fill="#A07850"/>
<path d="M10 96 V70 Q10 52 24 52 Q38 52 38 70 V96Z" fill="#4E32B5"/>
<circle cx="24" cy="42" r="9" fill="#C68642"/>
<path d="M-6 74 H10 L8 90 H-4Z" fill="#A07850"/>
</g>
<!-- a cart -->
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<path d="M126 58 L150 42" stroke-width="4" stroke-linecap="round"/>
<rect x="66" y="44" width="62" height="30" rx="3" fill="#A07850"/>
<circle cx="82" cy="80" r="11" fill="#FFFFFF"/><circle cx="114" cy="80" r="11" fill="#FFFFFF"/>
<circle cx="82" cy="80" r="3" fill="#0F0E0E"/><circle cx="114" cy="80" r="3" fill="#0F0E0E"/>
</g>
</g>

<!-- Source 2: a receipt -->
<g transform="rotate(2 500 278)">
<path d="M392 144 H608 V390 L596 402 L584 390 L572 402 L560 390 L548 402 L536 390 L524 402 L512 390 L500 402 L488 390 L476 402 L464 390 L452 402 L440 390 L428 402 L416 390 L404 402 L392 390Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/>
<path d="M410 198 H590 M410 360 H590" stroke="#D5D1DC" stroke-width="3" stroke-dasharray="8 6"/>
<g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-size="22" fill="#0F0E0E">
<text x="500" y="182" text-anchor="middle" font-weight="700">Hari Pasar</text>
<text x="590" y="230" text-anchor="end" fill="#4B4654">token</text>
<text y="270"><tspan x="410">Beras</tspan><tspan x="590" text-anchor="end">12</tspan></text>
<text y="308"><tspan x="410">Minyak masak</tspan><tspan x="590" text-anchor="end">8</tspan></text>
<text y="346"><tspan x="410">Teh</tspan><tspan x="590" text-anchor="end">5</tspan></text>
</g>
</g>

<!-- Source 3: a diary, open -->
<g transform="translate(776 280) rotate(-2)">
<rect x="-138" y="-100" width="276" height="206" rx="10" fill="#D2C0F9" stroke="#0F0E0E" stroke-width="3"/>
<path d="M0 -92 C-40 -104, -100 -102, -128 -92 V96 C-100 86, -40 86, 0 98Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/>
<path d="M0 -92 C40 -104, 100 -102, 128 -92 V96 C100 86, 40 86, 0 98Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/>
<g fill="none" stroke="#4B4654" stroke-width="2.5" stroke-linecap="round">
<path d="M-112 -62 q7 -8 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0"/>
<path d="M-112 -30 q7 -8 14 0 t14 0 t14 0 t14 0 t14 0 t14 0"/>
<path d="M-112 2 q7 -8 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0"/>
<path d="M-112 34 q7 -8 14 0 t14 0 t14 0 t14 0"/>
<path d="M16 -62 q7 -8 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0"/>
<path d="M16 -30 q7 -8 14 0 t14 0 t14 0 t14 0 t14 0"/>
<path d="M16 2 q7 -8 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0"/>
</g>
<path d="M60 96 V132 L70 124 L80 132 V92" fill="#4E32B5" stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- magnifying glass lying on the table -->
<g transform="translate(652 450) rotate(35)">
<rect x="30" y="-8" width="56" height="16" rx="8" fill="#7A4300" stroke="#0F0E0E" stroke-width="3"/>
<circle r="32" fill="#BFE0E8" stroke="#0F0E0E" stroke-width="6"/>
<path d="M-14 -16 A20 20 0 0 1 8 -22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- captions -->
<g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">
<text x="200" y="458">Lukisan</text>
<text x="500" y="458">Resit</text>
<text x="780" y="458">Diari</text>
</g>
</svg>
