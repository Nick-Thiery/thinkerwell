<path d="M618,184 H636" stroke="#4E32B5" stroke-width="5" stroke-linecap="round"/><path d="M652,184 L638,176 L638,192 Z" fill="#4E32B5"/>
<rect x="40" y="420" width="880" height="80" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
