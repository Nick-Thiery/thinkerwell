<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Một hy vọng, một quyết định, điều đã xảy ra</title>
<desc>Một đường thời gian với ba tấm thẻ. 1901: một lá thư, được đánh dấu là một hy vọng. 7 tháng 7 năm 1903: một quyết định của chính quyền, được đánh dấu là một hồ sơ chính thức. 1903: số tiền không được dùng, được đánh dấu là điều đã xảy ra.</desc>
<rect x="0" y="0" width="960" height="540" rx="24" fill="#DCEFD5"/>
<path d="M64,374 H896" stroke="#0F0E0E" stroke-width="4" stroke-linecap="round"/>
<path d="M170,336 V374" stroke="#0F0E0E" stroke-width="3"/><circle cx="170" cy="374" r="11" fill="#0F0E0E"/>
<rect x="40" y="32" width="260" height="304" rx="16" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<g transform="translate(170,100)"><path d="M-40,-30 H40 V30 H-40 Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/><path d="M-40,-30 L0,4 L40,-30" fill="none" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/><path d="M-40,30 L-10,2 M40,30 L10,2" stroke="#D5D1DC" stroke-width="3"/></g>
<text x="170" y="186" font-size="24" font-weight="700" fill="#2D6326" text-anchor="middle">1901:</text>
<text x="170" y="218" font-size="22" fill="#0F0E0E" text-anchor="middle">một lá thư</text>
<rect x="56" y="276" width="228" height="44" rx="22" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="2.5"/><circle cx="82" cy="298" r="12" fill="#D2C0F9" stroke="#0F0E0E" stroke-width="2.5"/><text x="102" y="305" font-size="20" fill="#0F0E0E">Hy vọng</text>

<path d="M480,336 V374" stroke="#0F0E0E" stroke-width="3"/><circle cx="480" cy="374" r="11" fill="#0F0E0E"/>
<rect x="350" y="32" width="260" height="304" rx="16" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<g transform="translate(480,100)"><path d="M-32,-40 H32 V40 H-32 Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/><path d="M-22,-26 H22 M-22,-14 H22 M-22,-2 H6" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/><circle cx="14" cy="22" r="12" fill="none" stroke="#4E32B5" stroke-width="3"/><circle cx="14" cy="22" r="6" fill="none" stroke="#4E32B5" stroke-width="2"/></g>
<text x="480" y="186" font-size="24" font-weight="700" fill="#2D6326" text-anchor="middle">7 tháng 7 năm 1903:</text>
<text x="480" y="218" font-size="22" fill="#0F0E0E" text-anchor="middle">một quyết định</text>
<text x="480" y="246" font-size="22" fill="#0F0E0E" text-anchor="middle">của chính quyền</text>
<rect x="366" y="276" width="228" height="44" rx="22" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="2.5"/><rect x="380" y="286" width="24" height="24" fill="#D5D1DC" stroke="#0F0E0E" stroke-width="2.5"/><text x="412" y="305" font-size="20" fill="#0F0E0E">Hồ sơ chính thức</text>

