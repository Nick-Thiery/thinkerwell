<text x="790" y="186" font-size="24" font-weight="700" fill="#2D6326" text-anchor="middle">1903:</text>
<text x="790" y="218" font-size="22" fill="#0F0E0E" text-anchor="middle">số tiền</text>
<text x="790" y="246" font-size="22" fill="#0F0E0E" text-anchor="middle">không được dùng</text>
