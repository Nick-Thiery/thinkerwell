<path d="M656,445 L672,474 H640 Z" fill="#FDE68A" stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round"/><text x="682" y="468" font-size="22" fill="#0F0E0E">Điều đã xảy ra</text>
</svg>
