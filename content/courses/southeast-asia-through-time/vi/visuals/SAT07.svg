<text x="150" y="412" font-size="22" fill="#0F0E0E" text-anchor="middle">Quân Anh đầu hàng</text>
<text x="810" y="384" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle">1945</text>
<text x="810" y="412" font-size="22" fill="#0F0E0E" text-anchor="middle">chiếm đóng kết thúc</text>
<rect x="140" y="446" width="680" height="70" rx="14" fill="#FFFFFF" stroke="#8C2548" stroke-width="3"/>
<text x="480" y="490" font-size="22" font-weight="700" fill="#8C2548" text-anchor="middle">Mỗi người có một trải nghiệm khác nhau.</text>
</svg>
