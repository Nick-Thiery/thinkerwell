<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Sau độc lập ở Timor-Leste</title>
<desc>Một đường thời gian gồm ba giai đoạn: cuộc bỏ phiếu năm 1999 và giai đoạn chuyển tiếp, với các trường học bắt đầu lại; nền độc lập được khôi phục ngày 20 tháng 5 năm 2002; và công việc giáo dục vẫn tiếp tục. Quanh giai đoạn cuối có bốn bong bóng: tòa nhà, giáo viên, ngôn ngữ và tài liệu, và cơ hội tiếp cận.</desc>
