<circle cx="300" cy="330" r="8" fill="#4E32B5"/>
<circle cx="660" cy="330" r="8" fill="#4E32B5"/>
<circle cx="150" cy="330" r="16" fill="#FDE68A" stroke="#0F0E0E" stroke-width="4"/>
<circle cx="810" cy="330" r="16" fill="#FDE68A" stroke="#0F0E0E" stroke-width="4"/>
