<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Perang dan kehidupan sehari-hari di Singapura</title>
<desc>Garis waktu dari 1942 sampai 1945. Garis waktu dimulai dengan menyerahnya Inggris pada 15 Februari 1942 dan berakhir saat pendudukan berakhir pada 1945. Satu catatan menunjukkan perubahan di sekolah: pelajaran bahasa Jepang yang wajib dan kebun sekolah. Catatan lain menunjukkan sistem jatah: kartu jatah, serta singkong dan ubi jalar sebagai pengganti nasi. Sebuah keterangan mengatakan bahwa orang yang berbeda punya pengalaman yang berbeda.</desc>
<rect x="0" y="0" width="960" height="540" rx="24" fill="#FDE0E8"/>
<rect x="40" y="32" width="430" height="228" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<text x="64" y="76" font-size="24" font-weight="700" fill="#8C2548">Perubahan di sekolah</text>
<path d="M390,74 Q366,64 342,70 V114 Q366,108 390,118 Q414,108 438,114 V70 Q414,64 390,74 Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/>
<path d="M390,74 V118" stroke="#0F0E0E" stroke-width="2.5"/>
<path d="M352,84 H380 M352,94 H380 M352,104 H374 M400,84 H428 M400,94 H428 M400,104 H420" stroke="#4B4654" stroke-width="2"/>
<circle cx="72" cy="142" r="6" fill="#8C2548"/>
<text x="90" y="150" font-size="22" fill="#0F0E0E"><tspan x="90">Pelajaran bahasa Jepang</tspan><tspan x="90" dy="28">wajib (1942)</tspan></text>
<circle cx="72" cy="214" r="6" fill="#8C2548"/>
<text x="90" y="222" font-size="22" fill="#0F0E0E">kebun sekolah</text>
<rect x="490" y="32" width="430" height="228" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<text x="514" y="76" font-size="24" font-weight="700" fill="#8C2548">Sistem jatah</text>
<rect x="770" y="58" width="58" height="40" rx="4" fill="#D2C0F9" stroke="#0F0E0E" stroke-width="3"/>
<path d="M778,70 H820" stroke="#0F0E0E" stroke-width="2.5"/>
<rect x="779" y="78" width="9" height="12" rx="1" fill="none" stroke="#0F0E0E" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="793" y="78" width="9" height="12" rx="1" fill="none" stroke="#0F0E0E" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="807" y="78" width="9" height="12" rx="1" fill="none" stroke="#0F0E0E" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M854,92 Q870,84 886,92 Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M842,92 H898 A28,22 0 0 1 842,92 Z" fill="#BFE0E8" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/>
<circle cx="522" cy="142" r="6" fill="#8C2548"/>
<text x="540" y="150" font-size="22" fill="#0F0E0E">kartu jatah</text>
<circle cx="522" cy="186" r="6" fill="#8C2548"/>
<text x="540" y="194" font-size="22" fill="#0F0E0E"><tspan x="540">singkong dan ubi jalar</tspan><tspan x="540" dy="28">sebagai pengganti nasi</tspan></text>
<path d="M300,260 V316" stroke="#4E32B5" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="330" r="8" fill="#4E32B5"/>
<path d="M660,260 V316" stroke="#4E32B5" stroke-width="4" stroke-linecap="round"/><circle cx="660" cy="330" r="8" fill="#4E32B5"/>
