<rect x="82" y="334" width="16" height="18" fill="none" stroke="#0F0E0E" stroke-width="2.5"/>
<text x="150" y="384" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle">15 Feb 1942</text>
<text x="150" y="412" font-size="22" fill="#0F0E0E" text-anchor="middle">Inggris menyerah</text>
