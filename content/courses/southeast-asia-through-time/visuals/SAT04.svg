<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Trade and exclusive control</title>
<desc>A schematic of trade connections in two panels. Left: the Banda Islands linked to English, Portuguese, Dutch and other buyers, so sellers can choose. Right: the VOC demands exclusive control, so only one link to the VOC remains and other buyers are shut out.</desc>
<rect x="0" y="0" width="960" height="540" rx="24" fill="#DCEFD5"/>
<rect x="24" y="24" width="444" height="446" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<text x="246" y="68" font-size="24" font-weight="700" fill="#2D6326" text-anchor="middle">Several buyers</text>
<path d="M186,226 L147,161" stroke="#4E32B5" stroke-width="4"/><path d="M142,152 L142,171 L158,161 Z" fill="#4E32B5"/>
<path d="M306,226 L345,161" stroke="#4E32B5" stroke-width="4"/><path d="M350,152 L334,161 L350,171 Z" fill="#4E32B5"/>
<path d="M186,290 L147,352" stroke="#4E32B5" stroke-width="4"/><path d="M142,360 L159,352 L142,341 Z" fill="#4E32B5"/>
<path d="M306,290 L345,352" stroke="#4E32B5" stroke-width="4"/><path d="M350,360 L350,341 L333,352 Z" fill="#4E32B5"/>
<rect x="146" y="226" width="200" height="64" rx="32" fill="#F3E3C3" stroke="#0F0E0E" stroke-width="4"/>
<g transform="translate(180,258)"><ellipse cx="0" cy="0" rx="14" ry="17" fill="#A07850" stroke="#0F0E0E" stroke-width="3"/><path d="M-6,-10 Q2,0 -4,11 M5,-11 Q-1,-1 6,9" fill="none" stroke="#F3E3C3" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="260" y="266" font-size="22" font-weight="700" fill="#0F0E0E" text-anchor="middle">Banda Islands</text>
<rect x="44" y="100" width="196" height="52" rx="12" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<text x="142" y="134" font-size="22" fill="#0F0E0E" text-anchor="middle">English traders</text>
<rect x="252" y="100" width="196" height="52" rx="12" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<text x="350" y="134" font-size="22" fill="#0F0E0E" text-anchor="middle">Portuguese traders</text>
<rect x="44" y="360" width="196" height="52" rx="12" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<text x="142" y="394" font-size="22" fill="#0F0E0E" text-anchor="middle">Dutch traders</text>
<rect x="252" y="360" width="196" height="52" rx="12" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<text x="350" y="394" font-size="22" fill="#0F0E0E" text-anchor="middle">Other visitors</text>
<text x="246" y="448" font-size="22" fill="#4B4654" text-anchor="middle">Sellers can choose</text>
<rect x="492" y="24" width="444" height="446" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<text x="714" y="68" font-size="24" font-weight="700" fill="#2D6326" text-anchor="middle">VOC demands exclusive control</text>
<path d="M654,226 L634,193" stroke="#4B4654" stroke-width="4" stroke-dasharray="6 6"/><path d="M619,202 L650,184" stroke="#0F0E0E" stroke-width="7" stroke-linecap="round"/>
