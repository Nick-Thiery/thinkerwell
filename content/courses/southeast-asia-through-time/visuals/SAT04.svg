<text x="610" y="394" font-size="22" font-weight="700" fill="#0F0E0E" text-anchor="middle">VOC</text>
<rect x="720" y="360" width="196" height="52" rx="12" fill="#FFFFFF" stroke="#4B4654" stroke-width="3" stroke-dasharray="8 6"/>
<text x="818" y="394" font-size="22" fill="#4B4654" text-anchor="middle">Other visitors</text>
<text x="714" y="448" font-size="22" fill="#4B4654" text-anchor="middle">Other buyers shut out</text>
<path d="M472,247 H484" stroke="#2D6326" stroke-width="0"/>
<text x="480" y="506" font-size="22" fill="#4B4654" text-anchor="middle">Trade connections, schematic</text>
</svg>
