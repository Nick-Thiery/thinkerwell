<rect x="614" y="226" width="200" height="64" rx="32" fill="#F3E3C3" stroke="#0F0E0E" stroke-width="4"/>
<g transform="translate(648,258)"><ellipse cx="0" cy="0" rx="14" ry="17" fill="#A07850" stroke="#0F0E0E" stroke-width="3"/><path d="M-6,-10 Q2,0 -4,11 M5,-11 Q-1,-1 6,9" fill="none" stroke="#F3E3C3" stroke-width="2.5" stroke-linecap="round"/></g>
<text x="728" y="266" font-size="22" font-weight="700" fill="#0F0E0E" text-anchor="middle">Banda Islands</text>
