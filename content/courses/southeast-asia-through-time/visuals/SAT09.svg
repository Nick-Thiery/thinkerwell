<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>After independence in Timor-Leste</title>
<desc>A timeline of Timor-Leste: a vote on 30 August 1999, a transition from 1999 to 2002, and independence restored on 20 May 2002. Education work starts during the transition and keeps going after 2002, with four things to decide: buildings, teachers, languages and materials, and access.</desc>
