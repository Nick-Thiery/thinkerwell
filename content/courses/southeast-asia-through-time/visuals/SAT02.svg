<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Butuan and the sea</title>
<desc>A modern outline map of the Philippines and nearby seas and islands, with Butuan marked on Mindanao. Dashed lines from Butuan toward China, Borneo and Sulawesi show possible connections, not a documented voyage. The key marks boat remains from the late 700s to early 900s, imported objects of different dates, and a place.</desc>
