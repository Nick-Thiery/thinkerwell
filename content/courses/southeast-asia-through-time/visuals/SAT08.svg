<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Two paths to independence</title>
<desc>Two timelines side by side. Indonesia: proclamation on 17 August 1945, then struggle and talks, then transfer of sovereignty on 27 December 1949. Federation of Malaya: agreement signed on 8 February 1956, independence on 31 August 1957, Malaysia formed on 16 September 1963, with the Malayan Emergency shown from 1948 to 1960.</desc>
<rect x="0" y="0" width="960" height="540" rx="24" fill="#FDE0E8"/>
<rect x="40" y="32" width="880" height="488" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<text x="64" y="72" font-size="26" font-weight="700" fill="#8C2548">Indonesia</text>
<path d="M72,124 H888" stroke="#D5D1DC" stroke-width="4" stroke-linecap="round"/>
<rect x="121" y="94" width="143" height="60" rx="18" fill="#ECE4FD" stroke="#0F0E0E" stroke-width="3"/>
<text x="192.54679163662445" y="118" font-size="22" fill="#0F0E0E" text-anchor="middle"><tspan x="192.54679163662445">struggle</tspan><tspan x="192.54679163662445" dy="26">and talks</tspan></text>
<circle cx="99" cy="124" r="16" fill="#FDE68A" stroke="#0F0E0E" stroke-width="4"/>
<rect x="271" y="109" width="30" height="30" rx="3" fill="#D2C0F9" stroke="#0F0E0E" stroke-width="4"/>
<text x="64" y="184" font-size="24" font-weight="700" fill="#0F0E0E">17 Aug 1945</text>
<text x="64" y="212" font-size="22" fill="#0F0E0E">proclamation</text>
<text x="270" y="184" font-size="24" font-weight="700" fill="#0F0E0E">27 Dec 1949</text>
<text x="270" y="212" font-size="22" fill="#0F0E0E">transfer of sovereignty</text>
<rect x="600" y="50" width="296" height="90" rx="14" fill="#FFFFFF" stroke="#8C2548" stroke-width="3"/>
<text x="748" y="88" font-size="22" font-weight="700" fill="#8C2548" text-anchor="middle"><tspan x="748">Different events,</tspan><tspan x="748" dy="28">different records.</tspan></text>
<path d="M64,240 H896" stroke="#D5D1DC" stroke-width="3"/>
<text x="64" y="280" font-size="26" font-weight="700" fill="#8C2548">Federation of Malaya</text>
<path d="M72,332 H888" stroke="#D5D1DC" stroke-width="4" stroke-linecap="round"/>
<path d="M638,332 L838.4,332.0" stroke="#4E32B5" stroke-width="4" stroke-linecap="round"/><path d="M851.4,332.0 L838.4,339.8 L838.4,324.2 Z" fill="#4E32B5" stroke="#4E32B5" stroke-width="2" stroke-linejoin="round"/>
<path d="M549,332 H616" stroke="#4E32B5" stroke-width="4"/>
<rect x="534" y="317" width="30" height="30" rx="3" fill="#D2C0F9" stroke="#0F0E0E" stroke-width="4"/>
<circle cx="616" cy="332" r="16" fill="#FDE68A" stroke="#0F0E0E" stroke-width="4"/>
<path d="M875,313 L894,332 L875,351 L856,332 Z" fill="#BFE0E8" stroke="#0F0E0E" stroke-width="4" stroke-linejoin="round"/>
<text x="565" y="374" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="end">8 Feb 1956</text>
<text x="565" y="402" font-size="22" fill="#0F0E0E" text-anchor="end">agreement signed</text>
<text x="600" y="374" font-size="24" font-weight="700" fill="#0F0E0E">31 Aug 1957</text>
<text x="600" y="402" font-size="22" fill="#0F0E0E">independence</text>
<text x="896" y="280" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="end">16 Sep 1963</text>
<text x="896" y="306" font-size="22" fill="#0F0E0E" text-anchor="end">Malaysia formed</text>
<rect x="201" y="420" width="515" height="10" rx="5" fill="#D5D1DC" stroke="#4B4654" stroke-width="2"/>
<text x="458.5263157894737" y="456" font-size="22" fill="#0F0E0E" text-anchor="middle">Malayan Emergency, 1948–1960</text>
<path d="M72,474 H888" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<path d="M72,468 V480" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<text x="72" y="504" font-size="22" fill="#4B4654" text-anchor="middle">1945</text>
<path d="M287,468 V480" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<text x="287" y="504" font-size="22" fill="#4B4654" text-anchor="middle">1950</text>
<path d="M501,468 V480" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<text x="501" y="504" font-size="22" fill="#4B4654" text-anchor="middle">1955</text>
<path d="M716,468 V480" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<text x="716" y="504" font-size="22" fill="#4B4654" text-anchor="middle">1960</text>
</svg>
