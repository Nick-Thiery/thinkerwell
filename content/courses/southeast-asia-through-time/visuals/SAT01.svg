<title>How context helps</title>
<desc>A schematic side view of soil layers at a dig. A painted pot lies in a middle layer with other small finds nearby, and an arrow shows its depth below the surface. Three tags sort the clues: found (a painted pot), measured (its depth and layer) and inferred (an idea to test).</desc>
