<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>How context helps</title>
<desc>A simple drawing of layers of earth with a pot in the middle layer. Labels show what was found (the pot), what was measured (its depth and position) and what is only inferred (an idea about its use, with a question mark).</desc>
