<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>A hope, a decision, an outcome</title>
<desc>A timeline of three cards. October 1901: a letter in which Kartini expresses a hope for a school (a wish). 7 July 1903: a decision on scholarships (an official record). Later: the scholarship was not taken (the outcome). A key matches each card to wish, official record or outcome.</desc>
<rect x="0" y="0" width="960" height="540" rx="24" fill="#DCEFD5"/>
<text x="48" y="66" font-size="28" font-weight="700" fill="#2D6326">Kartini: three kinds of evidence</text>
<path d="M64,352 H896" stroke="#0F0E0E" stroke-width="4" stroke-linecap="round"/>
<path d="M170,300 V352" stroke="#0F0E0E" stroke-width="3"/><circle cx="170" cy="352" r="11" fill="#0F0E0E"/>
<rect x="40" y="96" width="260" height="204" rx="16" fill="#ECE4FD" stroke="#0F0E0E" stroke-width="3"/>
<g transform="translate(170,150)"><path d="M-34,-36 H24 L34,-26 V36 H-34 Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/><path d="M-24,-20 q6,-6 12,0 t12,0 t12,0 t10,0 M-24,-4 q6,-6 12,0 t12,0 t12,0 t10,0 M-24,12 q6,-6 12,0 t12,0 t12,0" fill="none" stroke="#4E32B5" stroke-width="3" stroke-linecap="round"/></g>
<text x="170" y="236" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle">Letter</text>
<text x="170" y="270" font-size="22" fill="#0F0E0E" text-anchor="middle">hope for a school</text>
<text x="170" y="394" font-size="22" font-weight="700" fill="#2D6326" text-anchor="middle">October 1901</text>
<path d="M480,300 V352" stroke="#0F0E0E" stroke-width="3"/><circle cx="480" cy="352" r="11" fill="#0F0E0E"/>
<rect x="350" y="96" width="260" height="204" rx="16" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="5"/>
<g transform="translate(480,150)"><path d="M-34,-36 H34 V36 H-34 Z" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round"/><path d="M-24,-22 H24 M-24,-10 H24 M-24,2 H10" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="20" r="10" fill="#D2C0F9" stroke="#0F0E0E" stroke-width="3"/></g>
<text x="480" y="236" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle">Decision</text>
<text x="480" y="270" font-size="22" fill="#0F0E0E" text-anchor="middle">on scholarships</text>
<text x="480" y="394" font-size="22" font-weight="700" fill="#2D6326" text-anchor="middle">7 July 1903</text>
<path d="M790,300 V352" stroke="#0F0E0E" stroke-width="3"/><circle cx="790" cy="352" r="11" fill="#0F0E0E"/>
<rect x="660" y="96" width="260" height="204" rx="16" fill="#FDE68A" stroke="#0F0E0E" stroke-width="3"/>
<g transform="translate(790,150)"><path d="M-34,-36 H34 V36 H-34 Z" fill="#FFFFFF" stroke="#4B4654" stroke-width="3" stroke-dasharray="8 6"/><path d="M-24,-22 H24 M-24,-10 H24 M-24,2 H10" stroke="#D5D1DC" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="20" r="10" fill="#FFFFFF" stroke="#4B4654" stroke-width="3" stroke-dasharray="4 4"/></g>
<text x="790" y="236" font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle">Not taken</text>
<text x="790" y="270" font-size="22" fill="#0F0E0E" text-anchor="middle">the scholarship</text>
<text x="790" y="394" font-size="22" font-weight="700" fill="#2D6326" text-anchor="middle">Later</text>
<path d="M308,198 H326" stroke="#4E32B5" stroke-width="5" stroke-linecap="round"/><path d="M342,198 L328,190 L328,206 Z" fill="#4E32B5"/>
<path d="M618,198 H636" stroke="#4E32B5" stroke-width="5" stroke-linecap="round"/><path d="M652,198 L638,190 L638,206 Z" fill="#4E32B5"/>
<rect x="40" y="430" width="880" height="80" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<text x="68" y="478" font-size="22" font-weight="700" fill="#2D6326">Key</text>
<rect x="170" y="456" width="36" height="28" rx="6" fill="#ECE4FD" stroke="#0F0E0E" stroke-width="3"/><text x="220" y="478" font-size="22" fill="#0F0E0E">Wish</text>
<rect x="380" y="456" width="36" height="28" rx="6" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="5"/><text x="430" y="478" font-size="22" fill="#0F0E0E">Official record</text>
<rect x="680" y="456" width="36" height="28" rx="6" fill="#FDE68A" stroke="#0F0E0E" stroke-width="3"/><text x="730" y="478" font-size="22" fill="#0F0E0E">Outcome</text>
</svg>
