<path d="M275,318 H448" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<circle cx="291" cy="160" r="18" fill="#2D6326"/><text x="291" y="168" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="498" y="132" width="201" height="268" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<path d="M512,318 H685" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<circle cx="528" cy="160" r="18" fill="#2D6326"/><text x="528" y="168" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="735" y="132" width="201" height="268" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<path d="M749,318 H922" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<circle cx="765" cy="160" r="18" fill="#2D6326"/><text x="765" y="168" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
