<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>From tree to buyer</title>
<desc>A chain of four steps from a rubber tree to a buyer: a worker taps the tree, a worker makes the latex into sheets, a worker carries the sheets to a ship, and a buyer far away uses the rubber for tyres and wires. Above the chain, owners and investors are linked to profit. A callout asks: Who earned? Who worked?</desc>
<rect x="0" y="0" width="960" height="540" rx="24" fill="#DCEFD5"/>
<text x="48" y="60" font-size="28" font-weight="700" fill="#2D6326">From tree to buyer</text>
<text x="48" y="90" font-size="20" fill="#4B4654">Simplified: not the only way</text>
<text x="48" y="114" font-size="20" fill="#4B4654">the business worked</text>
<rect x="520" y="30" width="250" height="48" rx="12" fill="#FFFFFF" stroke="#0F0E0E" stroke-width="3"/>
<text x="645" y="61" font-size="20" fill="#0F0E0E" text-anchor="middle">Owners and investors</text>
<path d="M770,54 H806" stroke="#4E32B5" stroke-width="3" stroke-dasharray="6 5"/><text x="814" y="61" font-size="22" font-weight="700" fill="#4E32B5">profit</text>
<rect x="24" y="132" width="201" height="268" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<path d="M38,318 H211" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<circle cx="54" cy="160" r="18" fill="#2D6326"/><text x="54" y="168" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
