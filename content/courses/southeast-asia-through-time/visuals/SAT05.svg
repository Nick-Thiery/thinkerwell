<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>From tree to buyer</title>
<desc>A simplified four-stage chain for rubber: a tapper collects latex from a tree, a merchant buys and processes it, workers ship it, and a buyer such as a tyre or cable maker uses it. A person stands at each stage, and a callout asks: Who earned? Who worked?</desc>
