<rect x="735" y="92" width="201" height="306" rx="16" fill="#FFFFFF" stroke="#D5D1DC" stroke-width="3"/>
<path d="M749,296 H922" stroke="#0F0E0E" stroke-width="3" stroke-linecap="round"/>
<circle cx="769" cy="124" r="19" fill="#2D6326"/><text x="769" y="132" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
