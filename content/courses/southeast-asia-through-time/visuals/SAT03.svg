<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Melaka and the strait</title>
<desc>A modern explanatory map of the Strait of Malacca between Sumatra and the Malay Peninsula, with Melaka on the strait and a dashed sea route that links India to the west with China to the east. Below, three stages: a Malay sultanate in the 1400s, Portuguese rule from 1511, and Dutch rule from 1641, later British.</desc>
