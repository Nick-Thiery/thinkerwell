<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Pelabuhan sungai Hội An</title>
<desc>Peta moden yang ringkas tentang Hội An, berdekatan dengan tempat Sungai Thu Bồn bertemu laut. Bangunan menghadap jalan untuk pelanggan dan terbuka ke sungai untuk memuatkan barang di jeti. Anak panah putus-putus menunjukkan contoh laluan ke Asia Tenggara, Asia Timur dan kemudian Eropah. Garis masa di bawahnya menunjukkan pelabuhan perdagangan pada tahun 1400-an–1800-an, penyenaraian Warisan Dunia pada 1999 dan foto pada 2018.</desc>
