<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Melaka dan selat</title>
<desc>Peta moden Selat Melaka yang sempit antara Semenanjung Tanah Melayu dengan Sumatera, dengan Melaka ditanda di pantai semenanjung itu dan anak panah yang menunjukkan jalan ke Asia Timur dan Asia Barat. Di bawahnya, garis masa menunjukkan Kesultanan Melayu pada tahun 1400-an, kemudian pemerintahan Portugis dari tahun 1511, Belanda dari tahun 1641 dan British dari tahun 1824, dengan peta tahun 1604 dalam zaman Portugis.</desc>
