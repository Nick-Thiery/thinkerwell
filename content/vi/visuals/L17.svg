<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<title>Bữa ăn cộng đồng</title>
<desc>Những người hàng xóm cùng ăn một bữa tại một chiếc bàn dài, trong khi một người nấu ăn lớn tuổi dạy một người trẻ phụ giúp làm bánh mì. Những hình nhỏ cho thấy việc làm kim chi, một đĩa couscous và các vũ công Tonga.</desc>
