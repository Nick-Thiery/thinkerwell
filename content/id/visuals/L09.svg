<g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<g font-size="22" font-weight="700" fill="#7A4300" text-anchor="middle">
<text x="126" y="52">Sekitar 5.500<tspan x="126" dy="28">tahun lalu</tspan></text>
<text x="370" y="52">1000-an sampai<tspan x="370" dy="28">1400-an</tspan></text>
<text x="728" y="80">Sekarang</text>
</g>
<g font-size="22" fill="#0F0E0E" text-anchor="middle">
<text x="126" y="410">Mengangkut<tspan x="126" dy="26">muatan berat</tspan><tspan x="126" dy="28" fill="#4B4654">Mesopotamia</tspan></text>
<text x="370" y="410">Berbagi buku<tspan x="370" dy="28" fill="#4B4654">Tiongkok, Korea, Jerman</tspan></text>
<text x="620" y="410">Bicara, belajar<tspan x="620" dy="26">dari jauh</tspan></text>
<text x="836" y="410">Cahaya tanpa<tspan x="836" dy="26">kabel listrik</tspan></text>
</g>
</g>
</svg>
