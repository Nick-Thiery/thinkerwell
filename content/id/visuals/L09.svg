<circle cx="90" cy="318" r="6" fill="#0F0E0E"/><circle cx="164" cy="318" r="6" fill="#0F0E0E"/>
</g>

<!-- 2: movable printing blocks and a printed page -->
<g stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round">
<rect x="262" y="206" width="36" height="36" rx="3" fill="#A07850"/><rect x="302" y="206" width="36" height="36" rx="3" fill="#A07850"/>
<rect x="262" y="246" width="36" height="36" rx="3" fill="#A07850"/><rect x="302" y="246" width="36" height="36" rx="3" fill="#A07850"/>
<rect x="282" y="286" width="36" height="36" rx="3" fill="#A07850"/>
</g>
<path d="M272 218 H288 M272 230 H284 M272 256 V272 H288 M310 256 Q316 250 320 258 T330 264 M284 298 L292 310 L300 298 L308 310 L316 298" fill="none" stroke="#7A4300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
