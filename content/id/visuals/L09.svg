<!-- 3: a person using a mobile phone -->
<g stroke="#0F0E0E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M566 356 V300 Q566 262 604 262 Q642 262 642 300 V356Z" fill="#3F6B35"/>
