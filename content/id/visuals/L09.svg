<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
<title>Empat penemuan dari masa ke masa</title>
<desc>Garis waktu empat penemuan: roda, percetakan dengan balok yang bisa dipindah, ponsel, dan lampu tenaga surya. Masing-masing diberi label tentang apa yang diubahnya.</desc>
<rect width="960" height="540" rx="24" fill="#FFE9C7"/>

<!-- time line (not to scale: the breaks show long gaps) -->
<path d="M36 106 H904" stroke="#4B4654" stroke-width="4" stroke-linecap="round"/>
<path d="M926 106 L902 94 L902 118Z" fill="#4B4654"/>
<g stroke="#4B4654" stroke-width="4" stroke-linecap="round">
<path d="M222 94 H244 V118 H222Z" fill="#FFE9C7" stroke="none"/>
<path d="M222 120 L232 92 M234 120 L244 92"/>
<path d="M498 94 H520 V118 H498Z" fill="#FFE9C7" stroke="none"/>
<path d="M498 120 L508 92 M510 120 L520 92"/>
</g>
<g fill="#FDE68A" stroke="#0F0E0E" stroke-width="3">
<circle cx="126" cy="106" r="9"/><circle cx="370" cy="106" r="9"/><circle cx="620" cy="106" r="9"/><circle cx="836" cy="106" r="9"/>
</g>

<!-- cards -->
<g fill="#FFFFFF" stroke="#D5D1DC" stroke-width="2">
<rect x="28" y="130" width="196" height="248" rx="16"/>
<rect x="240" y="130" width="260" height="248" rx="16"/>
<rect x="516" y="130" width="208" height="248" rx="16"/>
</g>
<rect x="740" y="130" width="192" height="248" rx="16" fill="#1E4E94"/>

<!-- 1: potter's wheel and a cart with solid wheels -->
