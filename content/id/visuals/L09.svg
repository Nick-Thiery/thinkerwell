<path d="M62 164 H86" stroke-width="4" stroke-linecap="round"/>
<path d="M58 290 L38 300" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="108" cy="266" rx="17" ry="11" fill="#F3E3C3"/><ellipse cx="140" cy="262" rx="17" ry="12" fill="#F3E3C3"/><ellipse cx="170" cy="266" rx="16" ry="11" fill="#F3E3C3"/>
<rect x="58" y="274" width="138" height="34" rx="4" fill="#A07850"/>
