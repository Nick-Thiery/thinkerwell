<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
<title>Bayview grows</title>
<desc>Timeline of the fictional town Bayview growing from a small fishing harbour to a busy town with a new road, a school, buses and a crowded clinic.</desc>
<rect width="960" height="540" rx="24" fill="#DCEFD5"/>
<defs>
<clipPath id="pc"><rect width="280" height="312" rx="16"/></clipPath>
<!-- shared by the three years: sky, hills, land, sea, harbour and market stall -->
<g id="base">
<rect width="280" height="312" fill="#FFFFFF"/>
<path d="M0 84 Q70 50 140 76 T280 68 V110 H0Z" fill="#C9D9A8"/>
<rect y="100" width="280" height="140" fill="#DCEFD5"/>
<rect y="238" width="280" height="74" fill="#BFE0E8"/>
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<path d="M26 244 V266 M60 244 V266 M90 244 V266" stroke="#A07850" stroke-width="5"/>
<rect x="10" y="234" width="90" height="10" fill="#A07850"/>
<path d="M22 200 V232 M66 200 V232" stroke-width="3"/>
<path d="M12 186 H76 L70 202 H18Z" fill="#D2C0F9"/>
<rect x="16" y="216" width="56" height="16" fill="#A07850"/>
</g>
<g stroke="#0F0E0E" stroke-width="1.5"><circle cx="26" cy="211" r="5" fill="#7A9B4E"/><circle cx="38" cy="211" r="5" fill="#FDE68A"/><circle cx="50" cy="211" r="5" fill="#7A9B4E"/><circle cx="62" cy="211" r="5" fill="#FDE68A"/></g>
</g>
<g id="boat" stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<path d="M-26 -2 H26 L18 10 H-18Z" fill="#A07850"/>
<path d="M0 -2 V-30 L18 -8Z" fill="#FFFFFF"/>
</g>
<g id="hs" stroke="#0F0E0E" stroke-width="2" stroke-linejoin="round"><rect x="-11" y="-17" width="22" height="17" fill="#F3E3C3"/><path d="M-14 -17 L0 -29 L14 -17Z" fill="#A07850"/></g>
<g id="hm" stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round"><rect x="-17" y="-26" width="34" height="26" fill="#FFFFFF"/><path d="M-21 -26 L0 -44 L21 -26Z" fill="#A07850"/><rect x="-5" y="-14" width="10" height="14" fill="#A07850"/></g>
<g id="h2" stroke="#0F0E0E" stroke-width="2" stroke-linejoin="round"><rect x="-12" y="-34" width="24" height="34" fill="#F3E3C3"/><path d="M-15 -34 L0 -45 L15 -34Z" fill="#A07850"/><rect x="-7" y="-28" width="6" height="7" fill="#BFE0E8"/><rect x="2" y="-28" width="6" height="7" fill="#BFE0E8"/><rect x="-7" y="-15" width="6" height="7" fill="#BFE0E8"/><rect x="2" y="-15" width="6" height="7" fill="#BFE0E8"/></g>
<!-- the new road, leading inland towards the capital -->
<g id="road">
<path d="M128 240 L182 240 L160 96 L152 96Z" fill="#D5D1DC" stroke="#4B4654" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M155 234 L156 104" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8"/>
</g>
<!-- cold-storage building by the harbour -->
<g id="cold" stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<rect x="76" y="178" width="48" height="56" fill="#FFFFFF"/>
<rect x="76" y="178" width="48" height="12" fill="#BFE0E8"/>
<path d="M100 198 V226 M88 205 L112 219 M112 205 L88 219" stroke="#1E4E94" stroke-width="3" stroke-linecap="round"/>
</g>
<path id="arrow" d="M-12 0 H6 M16 0 L2 -10 L2 10Z" stroke="#4E32B5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="#4E32B5"/>
</defs>

<!-- Year 1: a small fishing harbour -->
<g transform="translate(24 80)">
<g clip-path="url(#pc)">
<use href="#base"/>
<use href="#boat" x="160" y="272"/><use href="#boat" x="236" y="290"/>
<use href="#hm" x="204" y="228"/><use href="#hm" x="254" y="216"/><use href="#hs" x="226" y="170"/><use href="#hs" x="130" y="176"/>
</g>
<rect width="280" height="312" rx="16" fill="none" stroke="#4B4654" stroke-width="2"/>
</g>
<use href="#arrow" x="322" y="236"/>

<!-- Year 8: a new road and a cold-storage building -->
<g transform="translate(340 80)">
<g clip-path="url(#pc)">
<use href="#base"/>
<use href="#road"/>
<use href="#cold"/>
<use href="#boat" x="160" y="276"/><use href="#boat" x="236" y="290"/>
<use href="#hm" x="208" y="230"/><use href="#hm" x="256" y="218"/><use href="#hs" x="204" y="172"/><use href="#hs" x="236" y="164"/><use href="#hs" x="266" y="172"/><use href="#hs" x="228" y="194"/>
<g stroke="#0F0E0E" stroke-width="2" stroke-linejoin="round">
<rect x="144" y="150" width="20" height="14" fill="#FFFFFF"/><rect x="156" y="144" width="10" height="10" fill="#D2C0F9"/>
<circle cx="148" cy="166" r="3.5" fill="#0F0E0E"/><circle cx="161" cy="166" r="3.5" fill="#0F0E0E"/>
</g>
</g>
<rect width="280" height="312" rx="16" fill="none" stroke="#4B4654" stroke-width="2"/>
</g>
<use href="#arrow" x="638" y="236"/>

<!-- Year 15: many more houses, a school, a bus and a busy clinic -->
<g transform="translate(656 80)">
<g clip-path="url(#pc)">
<use href="#base"/>
<use href="#road"/>
<use href="#cold"/>
<use href="#boat" x="150" y="280"/><use href="#boat" x="44" y="296"/>
<use href="#h2" x="16" y="132"/><use href="#h2" x="44" y="128"/><use href="#hs" x="72" y="126"/><use href="#h2" x="100" y="132"/><use href="#hs" x="126" y="128"/>
<use href="#hs" x="20" y="170"/><use href="#h2" x="48" y="174"/><use href="#hs" x="112" y="160"/>
<use href="#h2" x="196" y="118"/><use href="#hs" x="266" y="116"/>
<!-- school -->
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<rect x="190" y="160" width="80" height="38" fill="#FFFFFF"/>
<path d="M184 160 L230 140 L276 160Z" fill="#A07850"/>
<rect x="222" y="176" width="16" height="22" fill="#A07850"/>
<rect x="198" y="168" width="14" height="11" fill="#BFE0E8"/><rect x="248" y="168" width="14" height="11" fill="#BFE0E8"/>
</g>
<!-- buses -->
<g stroke="#0F0E0E" stroke-width="2" stroke-linejoin="round">
<rect x="142" y="112" width="30" height="15" rx="3" fill="#FDE68A"/>
<rect x="146" y="115" width="6" height="5" fill="#BFE0E8"/><rect x="155" y="115" width="6" height="5" fill="#BFE0E8"/><rect x="164" y="115" width="5" height="5" fill="#BFE0E8"/>
<circle cx="149" cy="129" r="3" fill="#0F0E0E"/><circle cx="166" cy="129" r="3" fill="#0F0E0E"/>
</g>
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<rect x="130" y="176" width="54" height="26" rx="5" fill="#FDE68A"/>
<rect x="135" y="181" width="11" height="9" fill="#BFE0E8"/><rect x="150" y="181" width="11" height="9" fill="#BFE0E8"/><rect x="165" y="181" width="11" height="9" fill="#BFE0E8"/>
<circle cx="142" cy="204" r="5" fill="#0F0E0E"/><circle cx="172" cy="204" r="5" fill="#0F0E0E"/>
</g>
<!-- small clinic with a long line of people outside -->
<g stroke="#0F0E0E" stroke-width="2.5" stroke-linejoin="round">
<rect x="230" y="206" width="46" height="30" fill="#FFFFFF"/>
<rect x="230" y="206" width="46" height="8" fill="#FDE68A"/>
<rect x="246" y="220" width="13" height="16" fill="#A07850"/>
</g>
<g stroke="#0F0E0E" stroke-width="1.5">
<path d="M184 236 V222 Q184 214 190 214 Q196 214 196 222 V236Z" fill="#1E4E94"/><circle cx="190" cy="207" r="5.5" fill="#8D5524"/>
<path d="M195 238 V224 Q195 216 201 216 Q207 216 207 224 V238Z" fill="#3F6B35"/><circle cx="201" cy="209" r="5.5" fill="#F1C27D"/>
<path d="M206 236 V222 Q206 214 212 214 Q218 214 218 222 V236Z" fill="#4E32B5"/><circle cx="212" cy="207" r="5.5" fill="#C68642"/>
<path d="M217 238 V224 Q217 216 223 216 Q229 216 229 224 V238Z" fill="#A07850"/><circle cx="223" cy="209" r="5.5" fill="#E0AC69"/>
</g>
</g>
<rect width="280" height="312" rx="16" fill="none" stroke="#4B4654" stroke-width="2"/>
</g>

<!-- labels -->
<g font-family="Atkinson Hyperlegible Next, Atkinson Hyperlegible, Verdana, sans-serif">
<g font-size="26" font-weight="700" fill="#2D6326" text-anchor="middle">
<text x="164" y="62">Year 1</text>
<text x="480" y="62">Year 8</text>
<text x="796" y="62">Year 15</text>
</g>
<g font-size="24" font-weight="700" fill="#0F0E0E" text-anchor="middle">
<text x="164" y="428">2,000 people</text>
<text x="480" y="428">5,000 people<tspan x="480" dy="30" font-size="22" fill="#4B4654">800 new jobs</tspan></text>
<text x="796" y="428">12,000 people</text>
</g>
<g font-size="22" font-weight="700" fill="#0F0E0E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">
<text x="440" y="218">Cold<tspan x="440" dy="24">storage</tspan></text>
<text x="510" y="174" text-anchor="start">New road</text>
<text x="886" y="214">School</text>
<text x="908" y="346" text-anchor="end">Clinic</text>
</g>
</g>
</svg>
